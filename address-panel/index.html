<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Adres zoeken</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Maven+Pro:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --primary: #0149B6;
    --accent: #008CD6;
    --ok: #0EBA6A;
    --warn: #FF8900;
    --danger: #D93025;
    --text: #1d2433;
    --muted: #667085;
    --line: #dde3ec;
    --bg: #ffffff;
    --soft: #f4f7fb;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 16px;
    font: 14px/1.45 "Helvetica Neue", Helvetica, Arial, sans-serif;
    color: var(--text);
    background: var(--bg);
  }
  h1 {
    font: 700 16px "Maven Pro", sans-serif;
    color: var(--primary);
    margin: 0 0 12px;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .badge {
    font: 500 11px "Maven Pro", sans-serif;
    padding: 2px 8px;
    border-radius: 999px;
    background: #fff3e6;
    color: #a35700;
  }
  label.lbl { display: block; font-weight: 600; margin: 0 0 4px; font-size: 12px; color: var(--muted); }
  input[type=text] {
    width: 100%;
    padding: 8px 10px;
    border: 1px solid var(--line);
    border-radius: 6px;
    font: inherit;
    color: inherit;
    background: #fff;
  }
  input[type=text]:focus { outline: 2px solid var(--accent); outline-offset: -1px; border-color: transparent; }

  .search { position: relative; }
  .suggestions {
    position: absolute; left: 0; right: 0; top: 100%;
    margin: 4px 0 0; padding: 4px 0; list-style: none;
    background: #fff; border: 1px solid var(--line); border-radius: 6px;
    box-shadow: 0 6px 20px rgba(1, 73, 182, .12);
    z-index: 10; max-height: 260px; overflow: auto;
  }
  .suggestions li { padding: 7px 10px; cursor: pointer; }
  .suggestions li small { display: block; color: var(--muted); }
  .suggestions li[aria-selected=true], .suggestions li:hover { background: var(--soft); }
  .suggestions .empty { color: var(--muted); cursor: default; }

  .card { margin-top: 14px; padding: 12px; border: 1px solid var(--line); border-radius: 8px; background: var(--soft); }
  .card h2 { font: 700 13px "Maven Pro", sans-serif; color: var(--primary); margin: 0 0 10px; }
  .grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
  .grid .wide { grid-column: span 2; }
  @media (max-width: 420px) { .grid { grid-template-columns: 1fr 1fr; } .grid .wide { grid-column: 1 / -1; } }

  .targets { display: flex; flex-wrap: wrap; gap: 8px; }
  .target {
    display: flex; align-items: center; gap: 6px;
    padding: 7px 12px; border: 1px solid var(--line); border-radius: 999px;
    background: #fff; cursor: pointer; user-select: none;
  }
  .target:has(input:checked) { border-color: var(--primary); background: #e9f0fb; color: var(--primary); font-weight: 600; }
  .target input { accent-color: var(--primary); margin: 0; }

  .actions { display: flex; gap: 8px; margin-top: 14px; }
  button {
    font: 500 14px "Maven Pro", sans-serif;
    padding: 8px 16px; border-radius: 6px; border: 1px solid var(--primary);
    cursor: pointer;
  }
  .btn-primary { background: var(--primary); color: #fff; }
  .btn-primary:hover { background: #003c96; }
  .btn-secondary { background: #fff; color: var(--primary); }
  button:disabled { opacity: .5; cursor: not-allowed; }

  .msg { margin-top: 12px; padding: 9px 12px; border-radius: 6px; font-size: 13px; }
  .msg.ok { background: #e7f8ef; color: #07673a; }
  .msg.err { background: #fdecea; color: var(--danger); }
  .msg.info { background: #fff3e6; color: #a35700; }
  pre { white-space: pre-wrap; font-size: 11px; background: #fff; padding: 8px; border-radius: 4px; margin: 8px 0 0; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
  <h1>
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M12 22s7-6.2 7-12a7 7 0 1 0-14 0c0 5.8 7 12 7 12z"/><circle cx="12" cy="10" r="2.5"/></svg>
    <span data-t="title">Adres zoeken</span>
    <span class="badge" id="modeBadge" hidden></span>
  </h1>

  <div id="fatal" class="msg err" hidden></div>

  <div id="app" hidden>
    <div class="search">
      <label class="lbl" for="q" data-t="searchLabel">Zoek op straat, postcode of plaats</label>
      <input id="q" type="text" autocomplete="off" role="combobox" aria-expanded="false"
             aria-controls="suggestions" aria-autocomplete="list" placeholder="bijv. 1012 JS 1 of Dam 1 Amsterdam">
      <ul id="suggestions" class="suggestions" role="listbox" hidden></ul>
    </div>

    <form id="form" class="card" hidden>
      <h2 data-t="foundAddress">Gevonden adres</h2>
      <div class="grid">
        <div class="wide"><label class="lbl" for="street" data-t="street">Straat</label><input id="street" type="text"></div>
        <div><label class="lbl" for="houseNumber" data-t="houseNumber">Huisnr.</label><input id="houseNumber" type="text"></div>
        <div><label class="lbl" for="houseNumberSuffix" data-t="suffix">Toevoeging</label><input id="houseNumberSuffix" type="text"></div>
        <div><label class="lbl" for="postalCode" data-t="postalCode">Postcode</label><input id="postalCode" type="text"></div>
        <div class="wide"><label class="lbl" for="city" data-t="city">Plaats</label><input id="city" type="text"></div>
        <div><label class="lbl" for="countryName" data-t="country">Land</label><input id="countryName" type="text" readonly></div>
      </div>

      <h2 style="margin-top:14px" data-t="saveAs">Opslaan als</h2>
      <div id="targets" class="targets"></div>

      <div class="actions">
        <button type="submit" class="btn-primary" id="saveBtn" data-t="save">Opslaan in Carerix</button>
        <button type="button" class="btn-secondary" id="resetBtn" data-t="reset">Opnieuw zoeken</button>
      </div>
    </form>

    <div id="msg" class="msg" hidden></div>
  </div>

<script>
(() => {
  const TEXT = {
    nl: {},
    en: {
      title: 'Address lookup', searchLabel: 'Search by street, postcode or city', foundAddress: 'Address found',
      street: 'Street', houseNumber: 'No.', suffix: 'Suffix', postalCode: 'Postcode', city: 'City',
      country: 'Country', saveAs: 'Save as', save: 'Save to Carerix', reset: 'Search again',
      noResults: 'No addresses found', chooseTarget: 'Choose at least one address type',
      saving: 'Saving…', saved: 'Address saved. Refresh the Carerix page to see the new values.',
      dryRun: 'Test mode: nothing was saved. This would be sent to Carerix:',
      missingParams: 'This panel needs ?entity=…&id=… in its URL.', demo: 'Demo addresses', test: 'Test mode',
    },
  };
  const DEFAULT_NL = {
    noResults: 'Geen adressen gevonden', chooseTarget: 'Kies minimaal één adrestype',
    saving: 'Opslaan…', saved: 'Adres opgeslagen. Ververs de Carerix-pagina om de nieuwe waarden te zien.',
    dryRun: 'Testmodus: er is niets opgeslagen. Dit zou naar Carerix gaan:',
    missingParams: 'Dit panel heeft ?entity=…&id=… in de URL nodig.', demo: 'Demo-adressen', test: 'Testmodus',
  };

  const params = new URLSearchParams(location.search);
  const entity = params.get('entity') || 'CREmployee';
  const recordId = params.get('id');
  const panelKey = params.get('key') || '';
  const lang = params.get('lang') === 'en' ? 'en' : 'nl';
  const t = (k) => TEXT[lang][k] || DEFAULT_NL[k] || k;

  // Static labels
  if (lang === 'en') {
    document.documentElement.lang = 'en';
    document.querySelectorAll('[data-t]').forEach((el) => { el.textContent = t(el.dataset.t); });
  }

  const $ = (id) => document.getElementById(id);
  const q = $('q'), list = $('suggestions'), form = $('form'), msg = $('msg');
  const FIELDS = ['street', 'houseNumber', 'houseNumberSuffix', 'postalCode', 'city', 'countryName'];

  let sessionToken = newSession();
  let suggestions = [];
  let active = -1;
  let current = null;       // parsed address from the backend
  let debounce;
  let requestSeq = 0;

  function newSession() {
    return crypto.randomUUID ? crypto.randomUUID() : String(Date.now()) + Math.random().toString(16).slice(2);
  }

  async function api(action, query = {}, body) {
    const url = new URL('../api/address', location.href);
    url.searchParams.set('action', action);
    for (const [k, v] of Object.entries(query)) url.searchParams.set(k, v);
    const res = await fetch(url, {
      method: body ? 'POST' : 'GET',
      headers: { 'X-Panel-Key': panelKey, ...(body ? { 'Content-Type': 'application/json' } : {}) },
      body: body ? JSON.stringify(body) : undefined,
    });
    const data = await res.json().catch(() => ({}));
    if (!res.ok) throw new Error(data.error || `HTTP ${res.status}`);
    return data;
  }

  function show(type, text, extra) {
    msg.className = `msg ${type}`;
    msg.textContent = text;
    if (extra) {
      const pre = document.createElement('pre');
      pre.textContent = extra;
      msg.appendChild(pre);
    }
    msg.hidden = false;
  }

  // ─── Init ───────────────────────────────────────────────────────────────
  async function init() {
    if (!recordId) {
      $('fatal').textContent = t('missingParams');
      $('fatal').hidden = false;
      return;
    }
    try {
      const config = await api('config', { entity });
      renderTargets(config.targets);
      const badges = [config.demoMode && t('demo'), config.dryRun && t('test')].filter(Boolean);
      if (badges.length) { $('modeBadge').textContent = badges.join(' · '); $('modeBadge').hidden = false; }
      $('app').hidden = false;
      q.focus();
    } catch (err) {
      $('fatal').textContent = err.message;
      $('fatal').hidden = false;
    }
  }

  function renderTargets(targets) {
    const wrap = $('targets');
    wrap.innerHTML = '';
    targets.forEach((tg, i) => {
      const lab = document.createElement('label');
      lab.className = 'target';
      const cb = document.createElement('input');
      cb.type = 'checkbox';
      cb.name = 'target';
      cb.value = tg.key;
      cb.checked = i === 0;
      lab.append(cb, document.createTextNode(tg.label));
      wrap.appendChild(lab);
    });
  }

  // ─── Autocomplete ───────────────────────────────────────────────────────
  q.addEventListener('input', () => {
    clearTimeout(debounce);
    const value = q.value.trim();
    if (value.length < 2) { closeList(); return; }
    debounce = setTimeout(() => search(value), 250);
  });

  async function search(value) {
    const seq = ++requestSeq;
    try {
      const data = await api('autocomplete', { q: value, session: sessionToken });
      if (seq !== requestSeq) return; // a newer search is running
      suggestions = data.suggestions;
      renderList();
    } catch (err) {
      show('err', err.message);
    }
  }

  function renderList() {
    list.innerHTML = '';
    active = -1;
    if (!suggestions.length) {
      const li = document.createElement('li');
      li.className = 'empty';
      li.textContent = t('noResults');
      list.appendChild(li);
    }
    suggestions.forEach((s, i) => {
      const li = document.createElement('li');
      li.role = 'option';
      li.id = `opt-${i}`;
      li.textContent = s.main;
      const small = document.createElement('small');
      small.textContent = s.secondary;
      li.appendChild(small);
      li.addEventListener('mousedown', (e) => { e.preventDefault(); choose(i); });
      list.appendChild(li);
    });
    list.hidden = false;
    q.setAttribute('aria-expanded', 'true');
  }

  function closeList() {
    list.hidden = true;
    q.setAttribute('aria-expanded', 'false');
    q.removeAttribute('aria-activedescendant');
  }

  function highlight(i) {
    [...list.children].forEach((li, n) => li.setAttribute('aria-selected', n === i));
    active = i;
    if (i >= 0) q.setAttribute('aria-activedescendant', `opt-${i}`);
  }

  q.addEventListener('keydown', (e) => {
    if (list.hidden || !suggestions.length) return;
    if (e.key === 'ArrowDown') { e.preventDefault(); highlight((active + 1) % suggestions.length); }
    else if (e.key === 'ArrowUp') { e.preventDefault(); highlight((active - 1 + suggestions.length) % suggestions.length); }
    else if (e.key === 'Enter' && active >= 0) { e.preventDefault(); choose(active); }
    else if (e.key === 'Escape') closeList();
  });
  q.addEventListener('blur', () => setTimeout(closeList, 100));

  async function choose(i) {
    const s = suggestions[i];
    closeList();
    q.value = [s.main, s.secondary].filter(Boolean).join(', ');
    msg.hidden = true;
    try {
      const data = await api('details', { placeId: s.placeId, session: sessionToken });
      sessionToken = newSession(); // a Google session ends with the details call
      current = data.address;
      FIELDS.forEach((f) => { $(f).value = current[f] || ''; });
      form.hidden = false;
    } catch (err) {
      show('err', err.message);
    }
  }

  // ─── Save ───────────────────────────────────────────────────────────────
  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    const targets = [...form.querySelectorAll('input[name=target]:checked')].map((c) => c.value);
    if (!targets.length) { show('err', t('chooseTarget')); return; }

    const address = { ...current };
    FIELDS.forEach((f) => { address[f] = $(f).value.trim(); });

    const btn = $('saveBtn');
    btn.disabled = true;
    show('info', t('saving'));
    try {
      const result = await api('save', {}, { entity, id: recordId, targets, address });
      if (result.dryRun) show('info', t('dryRun'), result.xml);
      else show('ok', t('saved'));
      if (result.warnings?.length) {
        const w = document.createElement('div');
        w.style.marginTop = '6px';
        w.textContent = '⚠ ' + result.warnings.join(' · ');
        msg.appendChild(w);
      }
    } catch (err) {
      show('err', err.message);
    } finally {
      btn.disabled = false;
    }
  });

  $('resetBtn').addEventListener('click', () => {
    form.hidden = true;
    msg.hidden = true;
    current = null;
    q.value = '';
    q.focus();
  });

  init();
})();
</script>
</body>
</html>
